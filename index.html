<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dizengoff 23 — This week in Tel Aviv</title>
    <meta
      name="description"
      content="An interactive 3D house on Dizengoff Street. This week’s roof parties, transit, restaurants, and parking in Tel Aviv."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Heebo:wght@500;700;800&family=Outfit:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="loader">
      <p id="loader-status">Arriving in Tel Aviv... <span id="loader-pct">0%</span></p>
      <button id="start" type="button" hidden>START</button>
    </div>

    <div id="hud" hidden>
      <header class="hud-top">
        <p class="hint" id="hint">Drag to look around · Click the roof, bike, door, car, or trash</p>
      </header>

      <aside class="credit">
        <p class="credit-name">Dizengoff 23</p>
        <p class="credit-role" id="week-label">This week in Tel Aviv</p>
        <p class="credit-role" id="cycle-label"></p>
      </aside>

      <div class="explore-menu">
        <nav class="dock" id="explore-dock" aria-label="Explore">
          <button data-view="street" class="is-active">Street</button>
          <button data-view="roof">Roof</button>
          <button data-view="bike">Ride</button>
          <button data-view="door">Eat</button>
          <button data-view="car">Park</button>
          <button data-view="dumpster">Trash</button>
        </nav>
        <button class="menu-toggle" type="button" aria-controls="explore-dock" aria-expanded="false" aria-label="Open menu">
          <span class="burger" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <article id="panel" hidden>
      <button class="panel-close" type="button" aria-label="Close">← Street</button>
      <p class="panel-kicker" id="panel-kicker"></p>
      <h2 id="panel-title"></h2>
      <div id="panel-body"></div>
    </article>

    <div id="hover-label" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
